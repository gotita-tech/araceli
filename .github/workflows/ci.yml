name: CI

# Comprueba cada cambio antes de que Vercel lo despliegue:
# lint, tipos, pruebas del motor de orientación y build de producción.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  verificar:
    name: Lint, tipos, pruebas y build
    runs-on: ubuntu-latest

    steps:
      - name: Descargar el repositorio
        uses: actions/checkout@v4

      - name: Preparar Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      - name: Instalar dependencias
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Comprobación de tipos
        run: npm run typecheck

      - name: Pruebas del motor de orientación
        run: npm test

      - name: Build de producción
        run: npm run build
